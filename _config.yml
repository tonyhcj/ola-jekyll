url: "https://tonyhcj.github.io"
baseurl: "/ola-jekyll"

collections:
  authors:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - assets/css/styles.css

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  sass_dir: _sass
  style: compressed
