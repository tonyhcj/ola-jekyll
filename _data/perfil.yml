site: | 
 <section id="apresentacao">
    
    <h1 class="primeiro-title">Sobre o Jekyll</h1>
    <p class="primeiro-p">
        Este projeto foi desenvolvido com <strong>Jekyll</strong>, um gerador de sites
        estáticos.<br><br/> Ele transforma arquivos em Markdown, HTML e YAML<br><br/>
        em páginas prontas para publicação, utilizando layouts e templates com
        Liquid. <br><br/>Como o resultado é um site totalmente estático, ele oferece maior<br><br/>
        desempenho, segurança e facilidade de hospedagem.
    </p>
  
    <h2 class="segundo-title">Curiosidades</h2>
    <p class="segundo-u">
        Criado por Tom Preston-Werner, cofundador do GitHub.<br><br/>
        É o gerador oficial do GitHub Pages.<br><br/>
        Muito utilizado em blogs, portfólios e documentações.<br><br/>
        Permite reutilizar componentes e automatizar a criação das páginas.<br><br/>
    </p>
    
    <h2 class="terceiro-title">Estrutura do Projeto</h2>
 
    <p class="terceiro-u">
        <strong>_config.yml:</strong> configurações gerais do site.<br><br/>
        <strong>_layouts:</strong> modelos utilizados pelas páginas.<br><br/>
        <strong>_includes:</strong> componentes reutilizáveis, como menu e rodapé.<br><br/>
        <strong>_data:</strong> arquivos YAML com informações do site.<br><br/>
        <strong>assets:</strong> imagens, estilos SCSS e scripts JavaScript.<br><br/>
        <strong>index.html</strong> e <strong>especial.md:</strong> páginas geradas automaticamente pelo Jekyll.<br><br/>
    </p>

 </section>


